name: Publier l'image du front FTELMarket

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de l'image publiée sur Docker Hub"
        required: true
        default: latest
      push_latest:
        description: "Publier également le tag latest"
        type: boolean
        default: true

concurrency:
  group: ftelmarket-front-docker
  cancel-in-progress: false

jobs:
  publish:
    name: Construire et publier
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: S'authentifier sur Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calculer les tags
        id: tags
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ftelmarket-front
          TAG: ${{ inputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          tags="$IMAGE:$TAG"
          if [ "$PUSH_LATEST" = "true" ] && [ "$TAG" != "latest" ]; then
            tags="$tags,$IMAGE:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Récapitulatif
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for tag in $(echo "$TAGS" | tr ',' ' '); do
            echo "- \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done
